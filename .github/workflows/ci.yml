name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Morph.sln

      - name: Build
        run: dotnet build Morph.sln --configuration Release --no-restore

      # Plugin discovery/loader tests expect first-party addons under src/Morph.Host/plugins
      # (that folder is gitignored; install from Release build output).
      - name: Install reference addons into Host plugins folder
        run: |
          set -euo pipefail
          plugins_dir="src/Morph.Host/plugins"
          mkdir -p "$plugins_dir"
          for out in \
            addons/Morph.Addon.Bale/bin/Release/net9.0 \
            addons/Morph.Addon.Mellipayamak/bin/Release/net9.0 \
            addons/Morph.Addon.Soap/bin/Release/net9.0
          do
            dotnet run --project tools/Morph.Cli --configuration Release --no-build -- \
              plugin install "$out" --path "$plugins_dir"
          done
          ls -la "$plugins_dir"/*/morph.plugin.json

      - name: Unit / architecture tests
        run: >
          dotnet test tests/Morph.Architecture.Tests/Morph.Architecture.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal

      - name: Host integration / API e2e (Testcontainers)
        run: >
          dotnet test tests/Morph.Host.Integration.Tests/Morph.Host.Integration.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal

      - name: Full solution tests
        run: >
          dotnet test Morph.sln
          --configuration Release
          --no-build
          --verbosity minimal
          --filter "FullyQualifiedName!~Morph.Host.Integration.Tests"
