name: Bug report
description: Something is broken or unexpected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please redact secrets. Security issues → see SECURITY.md (private report).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, commands, or sample YAML
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. main @ abc1234
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Host / Platform API
        - Access
        - DataPlane / Records
        - Files / storage
        - Processes
        - CLI
        - SDK (.NET / TypeScript)
        - Dev Panel
        - Docs
        - Other
